[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Tudo em /assets tem hash de conteúdo no nome, posto lá pelo Vite — JS, CSS e
# as imagens importadas de src/assets. O nome muda junto com o conteúdo, então
# cachear para sempre não tem como servir versão velha.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
